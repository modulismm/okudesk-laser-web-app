##
## Nginx vhost example for bouh.space
## - Proxies to docker-compose service bound on 127.0.0.1:8000
## - Put this in e.g. /etc/nginx/sites-available/bouh.space and symlink to sites-enabled
##

server {
  listen 80;
  server_name laser.bouh.space;

  # If you use certbot, keep /.well-known for ACME challenges
  location /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  location / {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# After enabling HTTPS (certbot), you’ll typically have a second server block on 443.

