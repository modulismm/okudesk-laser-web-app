<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Oku Desk Raster</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0f17;
        --panel: #121a27;
        --text: #e8eefc;
        --muted: #93a4c6;
        --accent: #7aa2ff;
        --border: rgba(255,255,255,.08);
      }
      body { margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; background: var(--bg); color: var(--text); }
      .wrap { max-width: 980px; margin: 0 auto; padding: 24px; }
      .card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 18px; }
      h1 { font-size: 18px; margin: 0 0 12px; }
      p { margin: 8px 0; color: var(--muted); }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
      .row { display: grid; grid-template-columns: 180px 1fr; gap: 10px; align-items: center; margin: 10px 0; }
      label { color: var(--muted); font-size: 13px; }
      input, select { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: rgba(255,255,255,.04); color: var(--text); }
      input[type="file"] { padding: 8px; }
      .actions { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
      button { cursor: pointer; border: 1px solid var(--border); background: rgba(122,162,255,.15); color: var(--text); padding: 10px 14px; border-radius: 10px; }
      button:hover { border-color: rgba(122,162,255,.5); }
      pre { white-space: pre-wrap; word-break: break-word; background: rgba(0,0,0,.25); border: 1px solid var(--border); padding: 12px; border-radius: 10px; color: #cfe0ff; }
      .hint { font-size: 12px; color: var(--muted); }
      .divider { height: 1px; background: var(--border); margin: 14px 0; }
      @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } .row { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1>Oku Desk — Raster</h1>
        <p>
          Generates a raster <code>.gco</code> using <code>G1X...P&lt;hex&gt;</code> and embeds an <code>$MT</code> thumbnail.
          Use presets + safe mode for reliable machine-side tests.
        </p>

        <div class="grid">
          <div>
            <div class="row">
              <label>Image</label>
              <input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/bmp,image/svg+xml,.svg" />
            </div>

            <div class="row">
              <label>Origin</label>
              <select id="origin">
                <option value="bottom-left">Bottom-left</option>
                <option value="bottom-right">Bottom-right</option>
                <option value="top-left">Top-left</option>
                <option value="top-right">Top-right</option>
                <option value="center">Center</option>
              </select>
            </div>

            <div class="row">
              <label>Preset</label>
              <select id="preset">
                <option value="custom" selected>Custom</option>
                <option value="photo_gray">Photo (grayscale) — like the “cat6” baseline</option>
                <option value="photo_dither">Photo (dither) — safer tones</option>
                <option value="logo_bw">Logo (BW) — crisp</option>
              </select>
            </div>

            <div class="row">
              <label>Speed (mm/min)</label>
              <input id="speed" type="number" min="10" max="8000" value="1796" />
            </div>

            <div class="row">
              <label>Power (%)</label>
              <input id="power" type="number" min="1" max="100" value="40" />
            </div>

            <div class="row">
              <label>Passes</label>
              <input id="passes" type="number" min="1" max="200" value="1" />
            </div>

            <div class="row">
              <label>mm / pixel</label>
              <input id="mpp" type="number" min="0.01" step="0.01" value="0.15" />
            </div>

            <div class="row">
              <label>Invert image</label>
              <select id="invert">
                <option value="false" selected>No (recommended)</option>
                <option value="true">Yes</option>
              </select>
            </div>

            <div class="row">
              <label>Shading</label>
              <select id="shading">
                <option value="grayscale" selected>Grayscale (raw)</option>
                <option value="dither">Dither (simulate tones)</option>
              </select>
            </div>

            <div class="row">
              <label>Gamma</label>
              <input id="gamma" type="number" min="0.2" max="5" step="0.05" value="1.00" />
            </div>

            <div class="row">
              <label>Levels (0 = off)</label>
              <input id="levels" type="number" min="0" max="64" step="1" value="0" />
            </div>

            <div class="row">
              <label>Thumbnail mode</label>
              <select id="thumbMode">
                <option value="match-input" selected>Match input (recommended)</option>
                <option value="match-burn">Match burn-map</option>
              </select>
            </div>

            <div class="row">
              <label>Safe mode</label>
              <select id="safeMode">
                <option value="false" selected>Off</option>
                <option value="true">On (smaller chunks + lower accel)</option>
              </select>
            </div>

            <div class="actions">
              <button id="generate">Generate .gco</button>
              <button id="downloadPatterns">Download test PNGs</button>
            </div>
            <p class="hint">
              This endpoint is feature-flagged in production. If raster is disabled you will get an error. Enable with <code>ENABLE_RASTER=1</code>.
            </p>
          </div>

          <div>
            <p class="hint">Status</p>
            <pre id="status">Waiting for image…</pre>
          </div>
        </div>
      </div>
    </div>

    <!-- Shared with the vector app: SVG physical-size parsing lives in one place. -->
    <script src="svg-parser.js"></script>
    <script>
      const $ = (id) => document.getElementById(id);
      function setStatus(msg) { $("status").textContent = msg; }

      function applyPreset(id) {
        if (!id || id === "custom") return;
        const presets = {
          photo_gray: { speed: 1796, power: 40, mpp: 0.15, invert: false, shading: "grayscale", gamma: 1.0, levels: 0, safe: true },
          photo_dither: { speed: 2000, power: 35, mpp: 0.18, invert: false, shading: "dither", gamma: 0.95, levels: 0, safe: true },
          logo_bw: { speed: 2500, power: 60, mpp: 0.12, invert: false, shading: "dither", gamma: 1.0, levels: 2, safe: false },
        };
        const p = presets[id];
        if (!p) return;
        $("speed").value = String(p.speed);
        $("power").value = String(p.power);
        $("mpp").value = String(p.mpp.toFixed(2));
        $("invert").value = p.invert ? "true" : "false";
        $("shading").value = p.shading;
        $("gamma").value = String(p.gamma.toFixed(2));
        $("levels").value = String(p.levels);
        $("safeMode").value = p.safe ? "true" : "false";
        $("thumbMode").value = "match-input";
      }
      $("preset").addEventListener("change", () => applyPreset($("preset").value));

      function downloadBlob(filename, blob) {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      }

      async function fileToDataURL(file) {
        return await new Promise((resolve, reject) => {
          const fr = new FileReader();
          fr.onerror = () => reject(fr.error);
          fr.onload = () => resolve(String(fr.result));
          fr.readAsDataURL(file);
        });
      }

      // Guard rails: the bed is 500x285 mm, so 0.01 mm/pixel would ask for a
      // 50000 px wide canvas. Browsers fail at that silently or with an opaque
      // error, so refuse early with a message that names the fix.
      const MAX_SIDE_PX = 8000;
      const MAX_TOTAL_PX = 24000000;

      /**
       * Rasterise an SVG file to a PNG data URL at a given mm/pixel scale.
       *
       * Uses the browser's own SVG renderer, so the result matches what the
       * vector workspace shows and needs no server-side SVG library.
       *
       * Limitation: anything the SVG pulls in from outside itself - linked
       * images, webfonts by URL - will not be present. Text renders with the
       * fonts this machine has.
       *
       * @param {File} file
       * @param {number} mmPerPixel
       * @returns {Promise<{dataUrl: string, widthPx: number, heightPx: number, widthMm: number, heightMm: number}>}
       */
      async function rasterizeSvgFile(file, mmPerPixel) {
        const text = await file.text();
        const doc = new DOMParser().parseFromString(text, "image/svg+xml");
        if (doc.querySelector("parsererror")) {
          throw new Error("This SVG could not be parsed - the file may be malformed.");
        }
        const svg = doc.querySelector("svg");
        if (!svg) throw new Error("No <svg> element found in this file.");

        const dims = new SVGParser().getDimensions(svg);
        if (!(dims.width > 0) || !(dims.height > 0)) {
          throw new Error("This SVG has no usable width/height or viewBox, so its physical size is unknown.");
        }

        const mpp = Number(mmPerPixel) > 0 ? Number(mmPerPixel) : 0.15;
        const widthPx = Math.max(1, Math.round(dims.width / mpp));
        const heightPx = Math.max(1, Math.round(dims.height / mpp));

        if (widthPx > MAX_SIDE_PX || heightPx > MAX_SIDE_PX || widthPx * heightPx > MAX_TOTAL_PX) {
          throw new Error(
            `Rasterising this SVG at ${mpp} mm/pixel needs ${widthPx}x${heightPx} pixels, which is too large. ` +
            `Increase "mm / pixel" (0.1 is a fine engraving resolution).`
          );
        }

        // A viewBox is what lets width/height act as a scale. Without one the
        // user-unit system is fixed at 96dpi and forcing a pixel size would
        // crop or shrink the artwork instead of scaling it.
        if (!svg.getAttribute("viewBox")) {
          const pxPerMm = 96 / 25.4;
          svg.setAttribute("viewBox", `0 0 ${dims.width * pxPerMm} ${dims.height * pxPerMm}`);
        }
        svg.setAttribute("width", String(widthPx));
        svg.setAttribute("height", String(heightPx));
        svg.setAttribute("preserveAspectRatio", "xMidYMid meet");

        const serialized = new XMLSerializer().serializeToString(svg);
        // A blob URL is same-origin, so drawing it does not taint the canvas.
        const url = URL.createObjectURL(new Blob([serialized], { type: "image/svg+xml;charset=utf-8" }));

        try {
          const img = await new Promise((resolve, reject) => {
            const image = new Image();
            image.onload = () => resolve(image);
            image.onerror = () => reject(new Error(
              "The browser could not render this SVG. Files that link to external images " +
              "or use <foreignObject> cannot be rasterised here - export to PNG instead."
            ));
            image.src = url;
          });

          const c = document.createElement("canvas");
          c.width = widthPx;
          c.height = heightPx;
          const ctx = c.getContext("2d");
          // White background: the engine burns dark pixels, so transparent
          // areas must read as "no burn", not as black.
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(0, 0, widthPx, heightPx);
          ctx.drawImage(img, 0, 0, widthPx, heightPx);

          return {
            dataUrl: c.toDataURL("image/png"),
            widthPx, heightPx,
            widthMm: dims.width, heightMm: dims.height,
          };
        } finally {
          URL.revokeObjectURL(url);
        }
      }

      function canvasToBlob(canvas) {
        return new Promise((resolve) => canvas.toBlob(resolve, "image/png"));
      }
      function mkCanvas(w, h) {
        const c = document.createElement("canvas");
        c.width = w; c.height = h;
        const ctx = c.getContext("2d");
        ctx.fillStyle = "#fff";
        ctx.fillRect(0, 0, w, h);
        return { c, ctx };
      }

      async function makeGradientPNG() {
        const W = 900, H = 220;
        const { c, ctx } = mkCanvas(W, H);
        ctx.fillStyle = "#111";
        ctx.font = "20px system-ui, -apple-system, Segoe UI, Roboto, Arial";
        ctx.fillText("OKU raster test: gradient (white → black)", 18, 34);
        const y0 = 60, barH = 90;
        const grad = ctx.createLinearGradient(18, 0, W - 18, 0);
        grad.addColorStop(0, "#ffffff");
        grad.addColorStop(1, "#000000");
        ctx.fillStyle = grad;
        ctx.fillRect(18, y0, W - 36, barH);
        const steps = 16;
        const y1 = y0 + barH + 20;
        const bw = (W - 36) / steps;
        for (let i = 0; i < steps; i++) {
          const v = Math.round((i / (steps - 1)) * 255);
          ctx.fillStyle = `rgb(${v},${v},${v})`;
          ctx.fillRect(18 + i * bw, y1, bw + 1, 50);
        }
        ctx.strokeStyle = "#000";
        ctx.lineWidth = 1;
        ctx.strokeRect(18, y0, W - 36, barH);
        ctx.strokeRect(18, y1, W - 36, 50);
        return await canvasToBlob(c);
      }

      async function makeStepsPNG() {
        const W = 900, H = 260;
        const { c, ctx } = mkCanvas(W, H);
        ctx.fillStyle = "#111";
        ctx.font = "20px system-ui, -apple-system, Segoe UI, Roboto, Arial";
        ctx.fillText("OKU raster test: steps (0 → 100%)", 18, 34);
        const labels = [0, 15, 30, 45, 60, 75, 90, 100];
        const y0 = 60, boxH = 140;
        const bw = (W - 36) / labels.length;
        for (let i = 0; i < labels.length; i++) {
          const pct = labels[i];
          const v = Math.round(255 * (1 - pct / 100));
          ctx.fillStyle = `rgb(${v},${v},${v})`;
          ctx.fillRect(18 + i * bw, y0, bw + 1, boxH);
          ctx.fillStyle = "#111";
          ctx.font = "16px system-ui, -apple-system, Segoe UI, Roboto, Arial";
          ctx.fillText(`${pct}%`, 18 + i * bw + 10, y0 + boxH + 28);
        }
        ctx.strokeStyle = "#000";
        ctx.lineWidth = 1;
        ctx.strokeRect(18, y0, W - 36, boxH);
        return await canvasToBlob(c);
      }

      async function makeLinesPNG() {
        const W = 900, H = 320;
        const { c, ctx } = mkCanvas(W, H);
        ctx.fillStyle = "#111";
        ctx.font = "20px system-ui, -apple-system, Segoe UI, Roboto, Arial";
        ctx.fillText("OKU raster test: fine lines + text", 18, 34);
        const y0 = 70;
        const groups = [
          { spacing: 1, label: "1px spacing" },
          { spacing: 2, label: "2px spacing" },
          { spacing: 3, label: "3px spacing" },
          { spacing: 4, label: "4px spacing" },
        ];
        ctx.strokeStyle = "#000";
        for (let g = 0; g < groups.length; g++) {
          const top = y0 + g * 55;
          ctx.fillStyle = "#111";
          ctx.font = "14px system-ui, -apple-system, Segoe UI, Roboto, Arial";
          ctx.fillText(groups[g].label, 18, top + 14);
          const startX = 160;
          const endX = W - 18;
          for (let x = startX; x < endX; x += groups[g].spacing) {
            ctx.beginPath();
            ctx.moveTo(x + 0.5, top);
            ctx.lineTo(x + 0.5, top + 30);
            ctx.stroke();
          }
          ctx.strokeRect(startX, top, endX - startX, 30);
        }
        ctx.fillStyle = "#000";
        ctx.font = "16px system-ui, -apple-system, Segoe UI, Roboto, Arial";
        ctx.fillText("Text 16px: The quick brown fox 0123456789", 18, 300);
        ctx.font = "12px system-ui, -apple-system, Segoe UI, Roboto, Arial";
        ctx.fillText("Text 12px: The quick brown fox 0123456789", 18, 278);
        ctx.font = "10px system-ui, -apple-system, Segoe UI, Roboto, Arial";
        ctx.fillText("Text 10px: The quick brown fox 0123456789", 18, 258);
        return await canvasToBlob(c);
      }

      $("downloadPatterns").addEventListener("click", async () => {
        try {
          setStatus("Generating test PNGs…");
          const b1 = await makeGradientPNG();
          const b2 = await makeStepsPNG();
          const b3 = await makeLinesPNG();
          downloadBlob("oku_test_gradient.png", b1);
          downloadBlob("oku_test_steps.png", b2);
          downloadBlob("oku_test_lines_text.png", b3);
          setStatus("Downloaded: oku_test_gradient.png, oku_test_steps.png, oku_test_lines_text.png");
        } catch (e) {
          setStatus(`Error generating patterns: ${e?.message || e}`);
        }
      });

      $("generate").addEventListener("click", async () => {
        const f = $("file").files && $("file").files[0];
        if (!f) return setStatus("Pick an image first.");

        const mpp = Number($("mpp").value);

        // An SVG has no pixels of its own, so it is rasterised here, in the
        // browser, at exactly the requested mm/pixel. The server sizes the job
        // from the pixel count, so rasterising at that scale makes the physical
        // size come out right without passing explicit dimensions.
        const isSvg = f.type === "image/svg+xml" || /\.svg$/i.test(f.name || "");
        let dataUrl;
        if (isSvg) {
          setStatus("Rasterising SVG…");
          try {
            const r = await rasterizeSvgFile(f, mpp);
            dataUrl = r.dataUrl;
            setStatus(
              `Rasterised SVG to ${r.widthPx}x${r.heightPx} px ` +
              `(${r.widthMm.toFixed(1)}x${r.heightMm.toFixed(1)} mm at ${mpp} mm/pixel). Encoding…`
            );
          } catch (e) {
            return setStatus(`Error: ${e?.message || e}`);
          }
        } else {
          setStatus("Encoding image…");
          dataUrl = await fileToDataURL(f);
        }

        const payload = {
          image_base64: dataUrl,
          origin: $("origin").value,
          speed: Number($("speed").value),
          power: Number($("power").value),
          passes: Number($("passes").value),
          mm_per_pixel: Number($("mpp").value),
          invert_image: $("invert").value === "true",
          shading: $("shading").value,
          gamma: Number($("gamma").value),
          levels: Number($("levels").value),
          thumbnail_mode: $("thumbMode").value,
          thumbnail_contrast: 1.0,
          safe_mode: $("safeMode").value === "true",
        };

        setStatus("Generating G-code…");
        const res = await fetch("/api/generate-raster", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const json = await res.json().catch(() => ({}));
        if (!res.ok || json.success === false) {
          return setStatus(`Error: ${json.details || json.error || res.statusText}`);
        }

        const gcode = json.gcode || "";
        const filename = json.filename || "oku-raster.gco";
        setStatus(`OK. Generated ${gcode.length} chars. Downloading…`);
        downloadBlob(filename, new Blob([gcode], { type: "text/plain" }));
        setStatus("Done. Copy to USB and test on the machine.");
      });
    </script>
  </body>
</html>
